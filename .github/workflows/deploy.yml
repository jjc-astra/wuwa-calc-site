name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also run by wuwa-calc-data's workflow after each data push, so the bundled data goes live.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The data repo's data/ and images/ ship with the site, served from its own /data and /images.
      # Checked out before the build, which also reads its rankings index for the guide pages.
      - uses: actions/checkout@v4
        with:
          repository: jjc-astra/wuwa-calc-data
          ref: main
          path: data-repo

      - run: npm ci
      - run: npm run build
        env:
          WUWA_DATA_DIR: ../data-repo/data
      - run: cp -r ../data-repo/data ../data-repo/images dist/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
