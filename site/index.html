<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WuWa Calc</title>
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

<div id="app-layout">

    <div class="global-nav-header">
        <div class="header-left">
            <h2 class="section-title" style="display: flex; align-items: center; gap: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                WuWa Calculator
            </h2>
        </div>
        
        <div class="header-right">
            <a href="builder.html" class="base-btn nav-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Mechanics Builder</span>
                <svg class="nav-arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
        </div>
    </div>

    <div class="section-wrapper" id="step1-wrapper">
        <div class="section-header" id="team-header">
            <div class="header-left">
                <button id="team-toggle-btn" class="toggle-icon">▼</button>
                <h2 class="section-title">Step 1: Build Team</h2>
                <div id="header-team-preview" class="header-preview"></div>
            </div>
            
            <div class="header-right">
                <input type="file" id="team-import-input" accept=".json" style="display: none;">
                <button id="team-import-btn" class="base-btn">Import Team</button>
                <button id="team-export-btn" class="base-btn">Export Team</button>
            </div>
        </div>

        <div id="team-content" class="collapsible-content">
            <div id="team-roster" class="team-container"></div>
            <div id="idle-stats-container" class="idle-stats-wrapper"></div>
        </div>
    </div>

    <div class="section-wrapper is-collapsed" id="step2-wrapper">
        <div class="section-header" id="rotation-header">
            <div class="header-left">
                <button id="rotation-toggle-btn" class="toggle-icon collapsed">▼</button>
                <h2 class="section-title">Step 2: Build Rotation</h2>
            </div>
            <div class="header-right">
                <input type="file" id="rot-import-input" accept=".json" style="display: none;">
                <button id="rot-import-btn" class="base-btn">Import Rotation</button>
                <button id="rot-export-btn" class="base-btn">Export Rotation</button>
            </div>
        </div>

        <div id="rotation-content" class="collapsible-content is-collapsed">
            
            <div class="rotation-toolbar">
    
                <div class="flex-row gap-sm">
                    
                    <div class="btn-group">
                        <button id="rot-copy-btn" class="base-btn text-xs">Copy</button>
                        <button id="rot-paste-btn" class="base-btn text-xs" disabled>Paste</button>
                        <button class="base-btn icon-btn" id="rot-del-btn" title="Delete Selected Rows">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>

                    <div class="separator-v"></div>

                    <div class="btn-group">
                        <button class="base-btn icon-btn" id="rot-up-btn" title="Insert Row Above">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="12" y1="2" x2="12" y2="22"></line>
                                <polyline points="8 7 12 3 16 7"></polyline>
                            </svg>
                        </button>
                        <button class="base-btn icon-btn" id="rot-down-btn" title="Insert Row Below">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="12" y1="2" x2="12" y2="22"></line>
                                <polyline points="8 17 12 21 16 17"></polyline>
                            </svg>
                        </button>
                    </div>

                    <div class="separator-v"></div>

                    <div class="btn-group">
                        <button class="base-btn icon-btn" id="rot-undo-btn" title="Undo">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                        </button>
                        <button class="base-btn icon-btn" id="rot-redo-btn" title="Redo">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
                        </button>
                    </div>
                    
                    <div class="separator-v"></div>
                    
                    <div class="flex-row gap-sm" style="margin-left: 8px;">
                        <label class="toolbar-toggle-label" title="Start combat with max Resonance Energy">
                            <input type="checkbox" id="rot-start-energy" checked> Full Energy
                        </label>
                        <label class="toolbar-toggle-label" title="Start combat with max Concerto">
                            <input type="checkbox" id="rot-start-concerto"> Full Concerto
                        </label>
                    </div>

                </div>

                <div style="flex: 1;"></div>

                <button id="rot-calc-btn" class="base-btn text-xs" title="Re-roll RNG Stats">Calculate</button>

        </div>

            <div class="rotation-header-row"></div>

            <div id="rotation-builder" class="flex-col gap-sm" style="padding: 0;"></div>
        </div>
    </div>

<div id="custom-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <button id="modal-close-btn" class="modal-close-x">×</button>
        <div class="modal-content">
            <h3>Import Team Data?</h3>
            <p>Do you want to overwrite your current team?</p>
            <p>This rotation file contains Team Configuration data (Characters, Weapons, Echoes).</p>
            <p class="text-dim">Press "Keep Current" if you wish to only import the rotation.</p>
            
            <div class="modal-actions">
                <button id="modal-yes-btn" class="base-btn btn-primary">Yes, Overwrite</button>
                <button id="modal-no-btn" class="base-btn">No, Keep Current</button>
            </div>
        </div>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/utils/DataLoader.js"></script>
<script src="js/utils/Common.js"></script>
<script src="js/utils/Templates.js"></script>

<script src="js/systems/CommandSystem.js"></script>

<script src="js/logic/DSLParser.js"></script>
<script src="js/logic/CombatCalculator.js"></script>
<script src="js/logic/RosterState.js"></script>
<script src="js/logic/RosterRenderer.js"></script>
<script src="js/logic/RosterUtils.js"></script>

<script src="js/logic/ContextManager.js"></script>
<script src="js/logic/EventManager.js"></script>

<script src="js/logic/RotationState.js"></script>
<script src="js/logic/RotationRenderer.js"></script>
<script src="js/logic/RotationUtils.js"></script>

<script src="js/CalcGUIController.js"></script>
</body>
</html>
