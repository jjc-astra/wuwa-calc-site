<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-route title, description, canonical and Open Graph / Twitter tags: injected by
         routePagesPlugin (vite.config.ts) from src/config/routes.ts, into each view's own page. -->
    <!--route-meta-->
    <meta name="theme-color" content="#863bff" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WuWa Calculator",
        "alternateName": ["WuWa Calc", "Wuthering Waves Calculator", "Wuthering Waves Damage Calculator"],
        "url": "https://wuwacalc.com/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A free damage calculator and team rotation simulator for Wuthering Waves."
      }
    </script>

    <!-- Old hash-routed links (#/calculator/step-2) -> their path equivalents (/calculator/step-2/),
         before the app or GoatCounter read the URL. -->
    <script>
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', location.hash.slice(1).replace(/\/?$/, '/'));
      }
    </script>

    <!-- GoatCounter analytics: counts this load; in-app navigations are counted by useRoute. -->
    <script data-goatcounter="https://jjc-astra.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
